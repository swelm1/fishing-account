<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>حسابات الصيد</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif;background:#f1f5f9;color:#0f172a}
header{background:#0f172a;color:white;padding:22px 18px 18px;border-radius:0 0 22px 22px}
h1{margin:0 0 5px;font-size:25px}.sub{opacity:.75;font-size:13px}
main{max-width:760px;margin:auto;padding:14px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.card{background:white;border-radius:16px;padding:15px;box-shadow:0 2px 10px #0000000b}.label{font-size:13px;color:#64748b}.num{font-size:22px;font-weight:800;margin-top:5px}
nav{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:14px 0}.tab{border:0;background:white;border-radius:12px;padding:11px 5px;font-weight:700;color:#475569}.tab.active{background:#0f172a;color:white}
section{display:none}.active-section{display:block}.panel{background:white;border-radius:16px;padding:16px;margin-bottom:12px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{font-size:13px;color:#475569}input{width:100%;margin-top:6px;padding:12px;border:1px solid #cbd5e1;border-radius:11px;font-size:16px;background:white}
button.primary{width:100%;margin-top:12px;border:0;background:#0f172a;color:white;padding:13px;border-radius:11px;font-size:16px;font-weight:800}
.list{margin-top:12px}.item{border-top:1px solid #e2e8f0;padding:12px 0;display:flex;justify-content:space-between;gap:10px}.item small{display:block;color:#64748b;margin-top:4px}.amount{font-weight:800;white-space:nowrap}
.filter{display:flex;gap:7px;margin-bottom:10px}.filter button{flex:1;border:1px solid #cbd5e1;background:white;border-radius:10px;padding:9px}.filter button.active{background:#e2e8f0;font-weight:800}
.empty{text-align:center;color:#64748b;padding:22px}
.danger{border:0;background:#fee2e2;color:#991b1b;padding:8px 10px;border-radius:9px}
@media(max-width:420px){.row{grid-template-columns:1fr}.cards{grid-template-columns:1fr 1fr}nav{font-size:12px}}
</style>
</head>
<body>
<header><h1>🎣 حسابات الصيد</h1><div class="sub">المزاد والمصروفات والصيانة والربح</div></header>
<main>
<section id="home" class="active-section">
<div class="cards">
<div class="card"><div class="label">المبيعات</div><div class="num" id="salesTotal">0.000 د.ك</div></div>
<div class="card"><div class="label">المصروفات</div><div class="num" id="expensesTotal">0.000 د.ك</div></div>
<div class="card"><div class="label">الصيانة</div><div class="num" id="maintenanceTotal">0.000 د.ك</div></div>
<div class="card"><div class="label">صافي الربح</div><div class="num" id="profitTotal">0.000 د.ك</div></div>
</div>
<div class="panel" style="margin-top:12px">
<h2>💾 حفظ البيانات</h2>
<p class="sub" style="margin:0 0 10px">احفظ نسخة احتياطية من حساباتك أو استرجعها على جهاز آخر.</p>
<div class="row">
<button class="primary" style="margin-top:0" onclick="backupData()">💾 نسخ احتياطي</button>
<label style="display:block"><span>استرجاع نسخة</span><input id="restoreFile" type="file" accept=".json" onchange="restoreData(event)"></label>
</div>
</div>
<div class="panel" style="margin-top:12px">
<label>عرض حسب الفترة</label>
<div class="filter" id="periods">
<button data-p="all" class="active">الكل</button><button data-p="day">اليوم</button><button data-p="month">الشهر</button><button data-p="year">السنة</button>
</div>
<div id="periodInfo" class="sub"></div>
</div>
</section>

<section id="sales">
<div class="panel"><h2>🔨 المزاد</h2><div class="row"><div><label>التاريخ</label><input id="saleDate" type="date"></div><div><label>المبلغ (د.ك)</label><input id="saleAmount" type="number" step="0.001" min="0"></div></div><button class="primary" onclick="add('sales')">إضافة بيع</button></div>
<div class="panel"><div id="salesList" class="list"></div></div>
</section>

<section id="expenses">
<div class="panel"><h2>💸 المصروفات</h2><div class="row"><div><label>التاريخ</label><input id="expenseDate" type="date"></div><div><label>المبلغ (د.ك)</label><input id="expenseAmount" type="number" step="0.001" min="0"></div></div><button class="primary" onclick="add('expenses')">إضافة مصروف</button></div>
<div class="panel"><div id="expensesList" class="list"></div></div>
</section>

<section id="maintenance">
<div class="panel"><h2>🔧 الصيانة</h2><div class="row"><div><label>تاريخ الصيانة</label><input id="maintenanceDate" type="date"></div><div><label>المبلغ (د.ك)</label><input id="maintenanceAmount" type="number" step="0.001" min="0"></div></div><div style="margin-top:10px"><label>نوع الصيانة</label><input id="maintenanceType" placeholder="مثال: تبديل زيت"></div><button class="primary" onclick="add('maintenance')">إضافة صيانة</button></div>
<div class="panel"><div id="maintenanceList" class="list"></div></div>
</section>


<section id="traps">
<div class="panel"><h2>🪤 القراقير</h2>
<div class="row">
<div><label>تاريخ الشراء</label><input id="trapDate" type="date"></div>
<div><label>نوع القرقور</label><input id="trapType" placeholder="مثال: قرقور سمك"></div>
</div>
<div class="row" style="margin-top:10px">
<div><label>العدد</label><input id="trapQty" type="number" step="1" min="1"></div>
<div><label>إجمالي المبلغ (د.ك)</label><input id="trapAmount" type="number" step="0.001" min="0"></div>
</div>
<button class="primary" onclick="add('traps')">إضافة شراء</button></div>
<div class="panel"><div id="trapsList" class="list"></div></div>
</section>

<nav>
<button class="tab active" data-tab="home">الرئيسية</button><button class="tab" data-tab="sales">🔨 المزاد</button><button class="tab" data-tab="expenses">💸 المصروفات</button><button class="tab" data-tab="maintenance">🔧 الصيانة</button><button class="tab" data-tab="traps">🪤 القراقير</button>
</nav>
</main>
<script>
const key="fishing_accounts_v1";
let db=JSON.parse(localStorage.getItem(key)||'{"sales":[],"expenses":[],"maintenance":[],"traps":[]}');
let period="all";
const fmt=n=>Number(n).toFixed(3)+" د.ك";
const save=()=>localStorage.setItem(key,JSON.stringify(db));
const today=()=>new Date().toISOString().slice(0,10);
document.querySelectorAll('input[type=date]').forEach(x=>x.value=today());

function inPeriod(date){
 if(period==="all") return true;
 const d=new Date(date+"T00:00:00"), now=new Date();
 if(period==="day") return d.toDateString()===now.toDateString();
 if(period==="month") return d.getFullYear()===now.getFullYear()&&d.getMonth()===now.getMonth();
 if(period==="year") return d.getFullYear()===now.getFullYear();
}
function hijri(date){
 try{
  return new Intl.DateTimeFormat('ar-KW-u-ca-islamic', {day:'numeric',month:'long',year:'numeric'}).format(new Date(date+"T00:00:00"));
 }catch(e){return "—";}
}
function add(type){
 const map={sales:["saleDate","saleAmount"],expenses:["expenseDate","expenseAmount"],maintenance:["maintenanceDate","maintenanceAmount"],traps:["trapDate","trapAmount"]};
 const [di,ai]=map[type], date=document.getElementById(di).value, amount=Number(document.getElementById(ai).value);
 if(!date||!amount||amount<0){alert("أدخل التاريخ والمبلغ");return}
 const obj={id:Date.now(),date,amount};
 if(type==="maintenance"){obj.type=document.getElementById("maintenanceType").value.trim()||"صيانة";}
 if(type==="traps"){obj.type=document.getElementById("trapType").value.trim()||"قرقور";obj.qty=Number(document.getElementById("trapQty").value)||0;if(!obj.qty){alert("أدخل عدد القراقير");return;}}
 db[type].unshift(obj);save();render();
 document.getElementById(ai).value="";
 if(type==="maintenance") document.getElementById("maintenanceType").value="";
 if(type==="traps"){document.getElementById("trapType").value="";document.getElementById("trapQty").value="";}
}
function del(type,id){db[type]=db[type].filter(x=>x.id!==id);save();render()}
function list(type,id){
 const arr=db[type].filter(x=>inPeriod(x.date));
 const el=document.getElementById(id);
 if(!arr.length){el.innerHTML='<div class="empty">لا توجد عمليات</div>';return}
 el.innerHTML=arr.map(x=>`<div class="item"><div><b>${type==="maintenance"?escapeHtml(x.type):type==="traps"?escapeHtml(x.type):type==="sales"?"بيع من المزاد":"مصروف"}</b><small>${x.date} — ${hijri(x.date)}${type==="traps"?" — العدد: "+x.qty:""}</small></div><div><div class="amount">${fmt(x.amount)}</div><button class="danger" onclick="del('${type}',${x.id})">حذف</button></div></div>`).join("");
}
function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function render(){
 const sums={};
 for(const t of ["sales","expenses","maintenance","traps"]) sums[t]=db[t].filter(x=>inPeriod(x.date)).reduce((a,x)=>a+x.amount,0);
 salesTotal.textContent=fmt(sums.sales);expensesTotal.textContent=fmt(sums.expenses);maintenanceTotal.textContent=fmt(sums.maintenance);profitTotal.textContent=fmt(sums.sales-sums.expenses-sums.maintenance-sums.traps);
 periodInfo.textContent=period==="all"?"كل السجلات":"الفترة المختارة";
 list("sales","salesList");list("expenses","expensesList");list("maintenance","maintenanceList");list("traps","trapsList");
}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");document.querySelectorAll("section").forEach(x=>x.classList.remove("active-section"));document.getElementById(b.dataset.tab).classList.add("active-section");});
document.querySelectorAll("#periods button").forEach(b=>b.onclick=()=>{document.querySelectorAll("#periods button").forEach(x=>x.classList.remove("active"));b.classList.add("active");period=b.dataset.p;render()});

function backupData(){
 const blob=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),data:db},null,2)],{type:"application/json"});
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="حسابات_الصيد_نسخة_احتياطية.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function restoreData(e){
 const file=e.target.files[0]; if(!file)return;
 const reader=new FileReader();
 reader.onload=()=>{
  try{
   const obj=JSON.parse(reader.result);
   const d=obj.data||obj;
   if(!d.sales||!d.expenses||!d.maintenance||!d.traps) throw new Error();
   if(!confirm("سيتم استبدال البيانات الحالية بالنسخة الاحتياطية. هل أنت متأكد؟")) return;
   db=d;save();render();alert("تم استرجاع البيانات بنجاح.");
  }catch(err){alert("ملف النسخة الاحتياطية غير صالح.");}
 };
 reader.readAsText(file);
}

render();
</script><script>if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{});}</script>
</body>
</html>
